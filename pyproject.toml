# uv workspace root for refactorX Python packages.
# The root is virtual (not built); members are the deployable/importable packages.
[project]
name = "code-review-platform"
version = "0.0.0"
description = "Workspace root for refactorX (not a distributable package)."
requires-python = ">=3.14,<3.15"
dependencies = [
    "crp-core",
    "crp-analysis",
    "crp-api",
    "crp-worker",
    "crp-devtools",
    "crp-runner",
]

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.9",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/analysis",
    "services/api",
    "services/worker",
    "tools/devtools",
    "tools/local-runner",
]

[tool.uv.sources]
crp-core = { workspace = true }
crp-analysis = { workspace = true }
crp-api = { workspace = true }
crp-worker = { workspace = true }
crp-devtools = { workspace = true }
crp-runner = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["apps", "packages/contracts", "docs", "prompts", "fixtures/ai-eval"]  # ai-eval: deliberately defective samples

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "BLE", "RUF", "SIM", "PTH", "TRY"]
ignore = [
    "TRY003", # descriptive messages on domain exceptions are intentional
]

[tool.ruff.lint.isort]
known-first-party = ["crp_core", "crp_analysis", "crp_api", "crp_worker", "crp_devtools", "crp_runner"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S108", "E501"]
"conftest.py" = ["S101"]
"packages/core/src/crp_core/db/migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
mypy_path = [
    "packages/core/src",
    "packages/analysis/src",
    "services/api/src",
    "services/worker/src",
    "tools/devtools/src",
    "tools/local-runner/src",
]
explicit_package_bases = true
files = [
    "packages/core/src",
    "packages/analysis/src",
    "services/api/src",
    "services/worker/src",
    "tools/devtools/src",
    "tools/local-runner/src",
]

[tool.pytest.ini_options]
testpaths = [
    "packages/core/tests",
    "packages/analysis/tests",
    "services/api/tests",
    "services/worker/tests",
    "tools/devtools/tests",
    "tools/local-runner/tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "-ra", "--import-mode=importlib"]
markers = [
    "integration: needs real PostgreSQL and/or Temporal binaries (started ephemerally by fixtures)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
