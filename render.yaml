# Render Blueprint: the complete application on Render - one Docker web service (web UI + API +
# Temporal worker + Temporal dev server + analyzers) and a private PostgreSQL database.
# No settings to enter: the service derives its own URL and generates the sign-in token.
# Pushes to main redeploy after GitHub Actions CI passes. Guide: docs/DEPLOYMENT.md.
services:
  - type: web
    name: ai-code-reviewer
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: 1c-2g # analyzers need about 1-1.5 GB during a scan (docs/validation/P02_REPORT.md)
    healthCheckPath: /v1/health/live
    autoDeployTrigger: checksPass # deploy main only after GitHub Actions CI passes
    disk:
      name: crp-data # uploads, scan work area, Temporal history, offline Trivy DB
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: CRP_DATABASE_URL
        fromDatabase:
          name: ai-code-reviewer-db
          property: connectionString
      - key: CRP_ACCESS_TOKEN # sign-in secret: Render dashboard > service > Environment
        generateValue: true

databases:
  - name: ai-code-reviewer-db
    region: singapore
    plan: 0.1c-256mb
    postgresMajorVersion: "18"
    ipAllowList: [] # no external connections; only the service above can reach it
