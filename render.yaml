# FREE Render Blueprint: the complete application (web UI + API + scans with PMD, ESLint, Opengrep
# and Trivy) on Render's free instance and free PostgreSQL. Lite profile (ADR 0010): one process
# without a Temporal server, uploads and scan artifacts stored in PostgreSQL (the free instance has
# no persistent disk), one analyzer at a time within 512 MB of memory; the Trivy DB is baked into
# the image. Nothing to enter: the service derives its own URL and generates the sign-in token.
# Pushes to main redeploy after GitHub Actions CI passes. Guide: docs/DEPLOYMENT.md.
# Always-on paid variant: deploy/render-standard.yaml.
services:
  - type: web
    name: ai-code-reviewer
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: free # 512 MB / 0.1 CPU; sleeps after 15 idle minutes, wakes on the next visit
    healthCheckPath: /v1/health/live
    autoDeployTrigger: checksPass # deploy main only after GitHub Actions CI passes
    envVars:
      - key: CRP_PROFILE
        value: lite
      - key: CRP_DATABASE_URL
        fromDatabase:
          name: ai-code-reviewer-db
          property: connectionString
      - key: CRP_ACCESS_TOKEN # sign-in secret: Render dashboard > service > Environment
        generateValue: true

databases:
  - name: ai-code-reviewer-db
    region: singapore
    plan: free # 1 GB; Render expires free databases 30 days after creation (docs/DEPLOYMENT.md)
    postgresMajorVersion: "18"
    ipAllowList: [] # no external connections; only the service above can reach it
