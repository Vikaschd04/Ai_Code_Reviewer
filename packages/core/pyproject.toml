[project]
name = "crp-core"
version = "0.1.0"
description = "Code Review Platform shared core: typed settings, persistence, migrations, artifact store and workflow contracts."
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.1.1",
    "temporalio==1.33.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"
