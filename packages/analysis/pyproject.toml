[project]
name = "crp-analysis"
version = "0.1.0"
description = "refactorX analysis: intake validation, scope policy, manifests, inventory, structural parsing, engine adapters and normalization."
requires-python = ">=3.14,<3.15"
dependencies = [
    "crp-core",
    "tree-sitter==0.26.0",
    "tree-sitter-java==0.23.5",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
]

[tool.uv.sources]
crp-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"
