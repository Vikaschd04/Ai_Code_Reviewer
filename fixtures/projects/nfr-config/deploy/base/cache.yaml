apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cache
spec:
  replicas: 3
  serviceName: cache
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
    spec:
      containers:
        - name: cache
          image: registry.example.com/cache:7.2.0
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["cache-cli", "ping"]
