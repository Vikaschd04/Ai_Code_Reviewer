apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: registry.example.com/orders:2.2.0
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
