# Quality gate on every push/PR, plus a Linux build and smoke test of the application image
# (web UI + API + worker + analyzers) in the standard profile and in the lite profile under the
# Render free limits. Render deploys main only after these checks pass (render.yaml:
# autoDeployTrigger checksPass). Actions are pinned to commit SHAs.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.14"
          enable-cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - run: uv sync --locked --all-packages
      - run: pnpm install --frozen-lockfile
      - name: Lint, format and strict types
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
      - name: API contract drift
        run: |
          uv run crp-dev contracts --check
          pnpm --silent --filter @crp/contracts exec openapi-typescript openapi.json 2>/dev/null \
            | diff -q - packages/contracts/src/v1.d.ts
      - name: Web checks
        run: |
          pnpm typecheck
          pnpm lint
          pnpm format:check
      - name: Unit tests (integration tests need PostgreSQL, Temporal and engines; run locally)
        run: |
          uv run pytest -m "not integration"
          pnpm test
      - name: Web production build
        run: pnpm --filter @crp/web build

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Simulate a GitHub Codespace so the free deployment path (deploy/codespace.sh +
      # deploy/docker-compose.yml with PostgreSQL) is exercised exactly as users run it.
      CODESPACE_NAME: ci
      GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN: app.github.dev
      CRP_IMAGE: crp-app:ci
      CRP_SKIP_BUILD: "1"
      CRP_TRIVY_DB_AUTO_REFRESH: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: crp-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the complete application with Docker Compose and smoke-test it
        shell: bash # -eo pipefail: a failing smoke test fails the step despite tee
        env:
          SMOKE_REQUIRE_TRIVY: "1" # the vulnerability DB is baked into the image
        run: |
          bash deploy/codespace.sh up
          python3 deploy/smoke_test.py http://127.0.0.1:8080 "$(bash deploy/codespace.sh token)" \
            https://ci-8080.app.github.dev | tee smoke-standard.txt
          echo "::notice title=Standard profile smoke test::$(head -1 smoke-standard.txt)"
      - name: Application logs (standard profile)
        if: always()
        run: bash deploy/codespace.sh logs || true
      # The free Render Blueprint (render.yaml) runs the lite profile on 512 MB and 0.1 CPU;
      # prove the complete flow fits those limits without restarts or out-of-memory kills.
      - name: Lite profile (Render free) within 512 MB memory and 0.1 CPU
        shell: bash
        env:
          CRP_PROFILE: lite
          CRP_START_TIMEOUT_TICKS: "450"
          SMOKE_REQUIRE_TRIVY: "1"
          SMOKE_TIMEOUT_SECONDS: "900"
        run: |
          bash deploy/codespace.sh reset
          bash deploy/codespace.sh up
          python3 deploy/smoke_test.py http://127.0.0.1:8080 "$(bash deploy/codespace.sh token)" \
            https://ci-8080.app.github.dev | tee smoke-lite.txt
          app="$(docker ps -q --filter label=com.docker.compose.project=ai-code-reviewer \
            --filter label=com.docker.compose.service=app)"
          restarts="$(docker inspect -f '{{.RestartCount}}' "$app")"
          oom_flag="$(docker inspect -f '{{.State.OOMKilled}}' "$app")"
          oom_kills="$(docker exec "$app" awk '/^oom_kill /{print $2}' /sys/fs/cgroup/memory.events)"
          peak="$(docker exec "$app" cat /sys/fs/cgroup/memory.peak || echo unknown)"
          echo "::notice title=Lite profile - 512 MB and 0.1 CPU::memory.peak=${peak} bytes;" \
            "restarts=${restarts}; oom_killed=${oom_flag}; oom_kill=${oom_kills};" \
            "$(head -1 smoke-lite.txt)"
          test "$restarts" = 0 && test "$oom_flag" = false && test "$oom_kills" = 0
      - name: Application logs (lite profile)
        if: always()
        env:
          CRP_PROFILE: lite
        run: bash deploy/codespace.sh logs || true
