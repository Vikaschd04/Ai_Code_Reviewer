# Quality gate on every push/PR, plus a Linux build and smoke test of the backend image.
# Render deploys main only after these checks pass (render.yaml: autoDeployTrigger checksPass);
# Vercel builds the web UI on every push. Actions are pinned to commit SHAs.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.14"
          enable-cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - run: uv sync --locked --all-packages
      - run: pnpm install --frozen-lockfile
      - name: Lint, format and strict types
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
      - name: API contract drift
        run: |
          uv run crp-dev contracts --check
          pnpm --silent --filter @crp/contracts exec openapi-typescript openapi.json 2>/dev/null \
            | diff -q - packages/contracts/src/v1.d.ts
      - name: Web checks
        run: |
          pnpm typecheck
          pnpm lint
          pnpm format:check
      - name: Unit tests (integration tests need PostgreSQL, Temporal and engines; run locally)
        run: |
          uv run pytest -m "not integration"
          pnpm test
      - name: Web production build (what Vercel runs)
        run: pnpm --filter @crp/web build

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: crp
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: crp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crp" --health-interval 5s --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: crp-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the image and smoke-test it
        run: |
          TOKEN=$(python3 -c "import secrets; print(secrets.token_urlsafe(32))")
          docker run -d --name crp --network host \
            -e CRP_ACCESS_TOKEN="$TOKEN" \
            -e CRP_PUBLIC_HOST=127.0.0.1 \
            -e CRP_ALLOWED_WEB_ORIGINS=https://ci.example.test \
            -e DATABASE_URL=postgresql://crp:ci-only-password@127.0.0.1:5432/crp \
            -e PORT=8080 \
            -e CRP_TRIVY_DB_AUTO_REFRESH=0 \
            crp-backend:ci
          python3 deploy/smoke_test.py http://127.0.0.1:8080 "$TOKEN" https://ci.example.test
      - name: Container logs
        if: always()
        run: docker logs crp 2>&1 | tail -200 || true
