# Quality gate on every push/PR, plus a Linux build and smoke test of the application image
# (web UI + API + worker + analyzers). Render deploys main only after these checks pass
# (render.yaml: autoDeployTrigger checksPass). Actions are pinned to commit SHAs.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.14"
          enable-cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - run: uv sync --locked --all-packages
      - run: pnpm install --frozen-lockfile
      - name: Lint, format and strict types
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
      - name: API contract drift
        run: |
          uv run crp-dev contracts --check
          pnpm --silent --filter @crp/contracts exec openapi-typescript openapi.json 2>/dev/null \
            | diff -q - packages/contracts/src/v1.d.ts
      - name: Web checks
        run: |
          pnpm typecheck
          pnpm lint
          pnpm format:check
      - name: Unit tests (integration tests need PostgreSQL, Temporal and engines; run locally)
        run: |
          uv run pytest -m "not integration"
          pnpm test
      - name: Web production build
        run: pnpm --filter @crp/web build

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Simulate a GitHub Codespace so the free deployment path (deploy/codespace.sh +
      # deploy/docker-compose.yml with PostgreSQL) is exercised exactly as users run it.
      CODESPACE_NAME: ci
      GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN: app.github.dev
      CRP_IMAGE: crp-app:ci
      CRP_SKIP_BUILD: "1"
      CRP_TRIVY_DB_AUTO_REFRESH: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: crp-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the complete application with Docker Compose and smoke-test it
        run: |
          bash deploy/codespace.sh up
          python3 deploy/smoke_test.py http://127.0.0.1:8080 "$(bash deploy/codespace.sh token)" \
            https://ci-8080.app.github.dev
      - name: Application logs
        if: always()
        run: bash deploy/codespace.sh logs || true
