[project]
name = "crp-worker"
version = "0.1.0"
description = "refactorX Temporal worker (workflows and activities)."
requires-python = ">=3.14,<3.15"
dependencies = [
    "crp-analysis",
    "crp-core",
]

[project.scripts]
crp-worker = "crp_worker.__main__:main"

[tool.uv.sources]
crp-analysis = { workspace = true }
crp-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"
