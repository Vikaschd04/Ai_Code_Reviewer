[project]
name = "crp-devtools"
version = "0.1.0"
description = "Trusted-development tooling: local services, doctor, migrations, fixtures and bounded context utilities."
requires-python = ">=3.14,<3.15"
dependencies = [
    "crp-core",
    "crp-api",
    "crp-worker",
    "httpx==0.28.1",
]

[project.scripts]
crp-dev = "crp_devtools.cli:main"

[tool.uv.sources]
crp-core = { workspace = true }
crp-api = { workspace = true }
crp-worker = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"
