[project]
name = "crp-runner"
version = "0.1.0"
description = "User-invoked local runner for refactorX (folder capture/upload arrives in Phase 1)."
requires-python = ">=3.14,<3.15"
dependencies = [
    "httpx==0.28.1",
]

[project.scripts]
crp-runner = "crp_runner.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"
